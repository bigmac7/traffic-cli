name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly: new advisories appear without any code change
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Audit locked dependencies
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - name: Audit workflows
        run: uvx zizmor@1.9.0 .github/workflows
        env:
          GH_TOKEN: ${{ github.token }} # enables zizmor's online checks (e.g. impostor commits)
