[project]
name = "traffic-cli"
version = "0.1.2"
description = "CLI tool to calculate travel times using routing APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "geopy>=2.4.1",
    "routingpy>=1.3.0",
]

[project.scripts]
traffic = "traffic.cli:traffic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traffic"]
